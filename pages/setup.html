<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instalación - NOOVA</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f7fa; }
    .card { background: #fff; border-radius: 20px; padding: 40px; max-width: 480px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.08); text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #666; margin: 0 0 24px; }
    .btn { padding: 14px 32px; background: #0a4b7a; color: #fff; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; font-weight: 600; width: 100%; }
    .btn:hover { background: #1a7bc4; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; }
    .status.success { display: block; background: #d4edda; color: #155724; }
    .status.error { display: block; background: #f8d7da; color: #721c24; }
    .status.info { display: block; background: #d1ecf1; color: #0c5460; }
    .btn.secondary { background: #6c757d; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Instalación NOOVA</h1>
    <p>Configuración inicial de la base de datos</p>
    <button class="btn" id="installBtn" onclick="instalar()">
      <i class="fas fa-database"></i> Instalar Base de Datos
    </button>
    <button class="btn secondary" onclick="probarConexion()" style="margin-top:12px;font-size:0.85rem;">
      Probar Conexión
    </button>
    <div id="status" class="status"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <script>
    async function instalar() {
      const btn = document.getElementById('installBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Instalando...';
      status.className = 'status info';
      status.textContent = 'Instalando base de datos...';
      status.style.display = 'block';

      try {
        const res = await fetch('/api/setup/install.php');
        const json = await res.json();
        if (json.success) {
          status.className = 'status success';
          status.innerHTML = '<strong>¡Base de datos instalada!</strong><br>' + (json.message || '') + '<br>Sentencias ejecutadas: ' + json.statements;
          setTimeout(() => { window.location.href = '/pages/aula_virtual/'; }, 2000);
        } else {
          status.className = 'status error';
          status.innerHTML = '<strong>Error:</strong> ' + (json.error || 'Error desconocido');
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Error de conexión: ' + e.message;
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-database"></i> Instalar Base de Datos';
    }

    async function probarConexion() {
      const status = document.getElementById('status');
      status.className = 'status info';
      status.textContent = 'Probando conexión...';
      status.style.display = 'block';

      try {
        const res = await fetch('/api/setup/install.php');
        const json = await res.json();
        if (json.success || (json.error && json.error.includes('Duplicate'))) {
          status.className = 'status success';
          status.textContent = 'Conexión exitosa. Base de datos lista.';
        } else {
          status.className = 'status error';
          status.textContent = 'Error: ' + (json.error || 'No se pudo conectar');
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Error de conexión: ' + e.message;
      }
    }
  </script>
</body>
</html>
